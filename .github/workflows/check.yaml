name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: macos-latest
            r: release
          - os: windows-latest
            r: release
          - os: ubuntu-latest
            r: devel
    env:
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          extra-packages: |
            any::roxygen2
            bioc::BiocCheck
          install-pandoc: true
      - name: Check generated source
        shell: Rscript {0}
        run: |
          Rcpp::compileAttributes()
          roxygen2::roxygenise()
          status <- system2("git", c("diff", "--exit-code", "--",
              "DESCRIPTION", "NAMESPACE", "man", "R/RcppExports.R",
              "src/RcppExports.cpp"))
          stopifnot(status == 0L)
      - name: Build and check the source package
        shell: Rscript {0}
        run: |
          options(warn = 2)
          status <- system2(file.path(R.home("bin"), "Rscript"),
              "tools/check-package.R")
          stopifnot(status == 0L)
      - name: Check Bioconductor conventions
        if: matrix.os == 'ubuntu-latest' && matrix.r == 'devel'
        shell: Rscript {0}
        run: |
          run_dirs <- list.dirs(".checks", recursive = FALSE)
          archives <- unlist(lapply(run_dirs, list.files,
              pattern = "[.]tar[.]gz$", full.names = TRUE))
          stopifnot(length(archives) == 1L)
          result <- BiocCheck::BiocCheck(archives[[1L]],
              checkDir = dirname(archives[[1L]]), `new-package` = TRUE)
          stopifnot(!length(result$error), !length(result$warning))
      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checks-${{ matrix.os }}-${{ matrix.r }}
          path: .checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
